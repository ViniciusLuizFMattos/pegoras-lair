<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcade da Mente</title>
<style>
:root{
  --bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;
  --txt:#f4f1ff;--mut:#b9b3dd;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);
  --acc:#ffd166;--acc2:#ff6b9d;--ok:#4ade80;--bad:#ff5470;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:var(--txt);
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 16px 56px}

/* HERO */
.hero{text-align:center;padding:48px 8px 28px}
.badge{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:99px;color:var(--acc);font-size:13px;letter-spacing:.14em;text-transform:uppercase;background:var(--card)}
.hero h1{font-size:clamp(34px,8vw,72px);line-height:1.05;margin:18px 0 8px;font-weight:900}
.hero h1 .nome{display:inline-block;background:linear-gradient(90deg,var(--acc),var(--acc2),#8be9fd,var(--acc));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite;cursor:pointer;filter:drop-shadow(0 0 18px rgba(255,107,157,.35))}
@keyframes flow{to{background-position:300% 0}}
.hero p{max-width:640px;margin:10px auto 0;color:var(--mut);font-size:clamp(16px,2.4vw,20px);line-height:1.5}
.cta{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;transition:.15s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}
.btn.main{background:linear-gradient(135deg,var(--acc2),#ff9a5a);border:0;color:#2a0b1a}
.btn.sel{background:var(--acc);color:#2b2100;border-color:var(--acc)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.progress{margin:26px auto 0;max-width:420px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}
.progress small{color:var(--mut);display:block;margin-top:6px}

/* GRID DE JOGOS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:20px}
.gcard{position:relative;text-align:left;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;transition:.18s;min-height:150px;display:flex;flex-direction:column;gap:6px}
.gcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,var(--c),transparent 62%);opacity:.38;transition:.18s}
.gcard:hover{transform:translateY(-5px) rotate(-.4deg);border-color:var(--c)}
.gcard:hover::before{opacity:.65}
.gcard>*{position:relative}
.gcard .em{font-size:38px}
.gcard b{font-size:18px}
.gcard span{color:var(--mut);font-size:14px;line-height:1.35}
.gcard .done{position:absolute;right:12px;top:10px;font-size:12px;font-weight:700;color:#06240f;background:var(--ok);padding:3px 9px;border-radius:99px}
footer{text-align:center;color:var(--mut);margin-top:44px;font-size:14px}

/* TELA DE JOGO */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 6px}
.top h2{margin:0;font-size:clamp(20px,4vw,28px)}
.rules{color:var(--mut);margin:2px 0 14px;line-height:1.45;font-size:15px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.stat{padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.stat small{color:var(--mut);font-weight:500;margin-right:6px}
.msg{min-height:24px;font-weight:600;color:var(--acc);text-align:center}

/* MODAL */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,6,25,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{max-width:520px;width:100%;max-height:88vh;overflow:auto;background:linear-gradient(160deg,#2c2670,#1c1850);border:1px solid var(--line);border-radius:22px;padding:26px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.modal h3{margin:0 0 8px;font-size:28px}
.modal p{color:#e0dbff;line-height:1.6;margin:10px 0}
.modal .big{font-size:56px}
.letter{text-align:left}
.letter h3{text-align:center}
.letter .sig{text-align:right;color:var(--acc);font-weight:700;font-size:18px;margin-top:16px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* SUDOKU */
.sdk{display:grid;grid-template-columns:repeat(9,1fr);width:min(92vw,468px);aspect-ratio:1;border:3px solid #cfc8ff;border-radius:8px;overflow:hidden;background:#1a1646;user-select:none}
.sdk div{display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.6vw,26px);border:1px solid rgba(255,255,255,.12);cursor:pointer;color:#9fd5ff;font-weight:600}
.sdk div.g{color:#fff;font-weight:800;background:rgba(255,255,255,.06)}
.sdk div.br{border-right:2.5px solid #cfc8ff}.sdk div.bb{border-bottom:2.5px solid #cfc8ff}
.sdk div.pe{background:rgba(255,255,255,.1)}.sdk div.sm{background:rgba(255,209,102,.3)}
.sdk div.se{background:rgba(255,209,102,.6);color:#000}.sdk div.bad{color:var(--bad);background:rgba(255,84,112,.22)}
.pad{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:min(92vw,468px)}
.pad button{padding:10px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:18px}
.pad button:hover{background:var(--acc);color:#222}

/* 2048 */
.b2048{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;width:min(92vw,420px);aspect-ratio:1;background:#2b2560;border-radius:16px;touch-action:none}
.t{display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:900;font-size:clamp(20px,6vw,34px);background:rgba(255,255,255,.08);color:#2a2150;transition:background .12s}
.t.n{animation:pop .22s}
.v2{background:#eee4da}.v4{background:#ede0c8}.v8{background:#f2b179;color:#fff}.v16{background:#f59563;color:#fff}.v32{background:#f67c5f;color:#fff}.v64{background:#f65e3b;color:#fff}
.v128{background:#edcf72;color:#fff;font-size:clamp(18px,5vw,30px)}.v256{background:#edcc61;color:#fff;font-size:clamp(18px,5vw,30px)}.v512{background:#edc850;color:#fff;font-size:clamp(18px,5vw,30px)}
.v1024,.v2048,.vbig{background:#edc22e;color:#fff;font-size:clamp(15px,4.2vw,26px)}
.cover{position:absolute;inset:0;border-radius:16px;background:rgba(20,16,60,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:900}

/* MEMORIA */
.mem{display:grid;gap:10px;width:min(92vw,480px)}
.card{aspect-ratio:1;perspective:600px;background:none;padding:0}
.card .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .4s}
.card.f .in{transform:rotateY(180deg)}
.card .fr,.card .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center}
.card .bk{background:linear-gradient(135deg,#6a5acd,#ff6b9d);font-size:26px;border:2px solid rgba(255,255,255,.3)}
.card .fr{transform:rotateY(180deg);background:#fff8e7;font-size:clamp(28px,8vw,44px)}
.card.ok .fr{background:#b8f5c9}

/* HANOI */
.hanoi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(94vw,640px)}
.peg{position:relative;height:260px;display:flex;flex-direction:column-reverse;align-items:center;padding-bottom:10px;border-radius:14px;background:var(--card);border:2px solid var(--line);cursor:pointer}
.peg::before{content:"";position:absolute;bottom:10px;top:20px;width:8px;border-radius:4px;background:#8f87d6}
.peg.sel{border-color:var(--acc);background:rgba(255,209,102,.12)}
.disc{position:relative;height:26px;margin-top:3px;border-radius:13px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);z-index:1}
.disc.top{outline:2px solid #fff6}

/* SLIDE */
.slide{display:grid;gap:6px;width:min(92vw,400px);aspect-ratio:1;padding:8px;background:#2b2560;border-radius:14px}
.slide button{border-radius:10px;font-weight:900;font-size:clamp(20px,7vw,34px);background:linear-gradient(135deg,#6a5acd,#8e7cff);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.slide button.e{visibility:hidden}
.slide button.right{background:linear-gradient(135deg,#22c55e,#16a34a)}

/* MINAS */
.ms{display:grid;gap:2px;padding:6px;background:#2b2560;border-radius:10px;user-select:none;touch-action:manipulation}
.ms button{width:var(--cs);height:var(--cs);font-size:calc(var(--cs)*.55);font-weight:900;padding:0;border-radius:4px;background:#7b6fd6;display:flex;align-items:center;justify-content:center}
.ms button.r{background:#e9e4ff;color:#222;cursor:default}
.ms button.m{background:var(--bad)}
.n1{color:#2563eb!important}.n2{color:#16a34a!important}.n3{color:#dc2626!important}.n4{color:#7c3aed!important}.n5{color:#b45309!important}.n6{color:#0891b2!important}.n7{color:#000!important}.n8{color:#666!important}

/* LUZES */
.lo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(90vw,380px);aspect-ratio:1;padding:10px;background:#2b2560;border-radius:16px}
.lo button{border-radius:12px;background:#17133f;border:2px solid #3a3380;transition:.15s}
.lo button.on{background:radial-gradient(circle,#fff6b0,#ffd166 60%,#ff9a5a);box-shadow:0 0 20px #ffd166aa;border-color:#fff3}

/* VELHA / 4 EM LINHA */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(86vw,330px);aspect-ratio:1}
.ttt button{border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:clamp(40px,14vw,68px);font-weight:900}
.ttt button.x{color:#8be9fd}.ttt button.o{color:var(--acc2)}.ttt button.w{background:rgba(74,222,128,.3)}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px;background:#1d4ed8;border-radius:14px;width:min(94vw,490px)}
.c4 button{aspect-ratio:1;border-radius:50%;background:#0b1b52;padding:0;border:0;position:relative}
.c4 button.p1{background:#ef4444}.c4 button.p2{background:#facc15}
.c4 button.w{box-shadow:0 0 0 4px #fff,0 0 16px #fff}

/* GENIUS */
.gen{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(86vw,360px);aspect-ratio:1;padding:12px;background:#15113a;border-radius:50%;}
.gen button{border-radius:20px;opacity:.5;transition:.1s}
.gen button.lit{opacity:1;filter:brightness(1.5);transform:scale(1.03);box-shadow:0 0 30px currentColor}
.gen button:nth-child(1){background:#22c55e;color:#22c55e;border-radius:100% 20px 20px 20px}
.gen button:nth-child(2){background:#ef4444;color:#ef4444;border-radius:20px 100% 20px 20px}
.gen button:nth-child(3){background:#facc15;color:#facc15;border-radius:20px 20px 20px 100%}
.gen button:nth-child(4){background:#3b82f6;color:#3b82f6;border-radius:20px 20px 100% 20px}

/* FORCA */
.hang svg{width:200px;height:220px;stroke:#fff;stroke-width:5;fill:none;stroke-linecap:round}
.word{font-size:clamp(26px,7vw,40px);letter-spacing:.2em;font-weight:900;text-align:center;min-height:50px}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px}
.kb button{width:42px;height:46px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:800}
.kb button:disabled{opacity:.3;cursor:default}.kb button.ok{background:var(--ok);color:#06240f}.kb button.no{background:var(--bad)}

/* SENHA */
.mm{display:flex;flex-direction:column;gap:6px;width:min(94vw,380px)}
.row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--card);border:1px solid transparent}
.row.cur{border-color:var(--acc)}
.slots{display:flex;gap:8px;flex:1}
.dot{width:36px;height:36px;border-radius:50%;background:#17133f;border:2px solid #4a43a0;padding:0}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:34px}
.fb i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.12)}
.fb i.b{background:#111;border:2px solid #fff}.fb i.w{background:#fff}
.palette{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.palette .dot{width:44px;height:44px;border:2px solid #fff6}
.sec{background:#17133f}
.lvbar{margin-bottom:14px}
.lvgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.lvgrid button{padding:9px 0;border-radius:8px;background:var(--card);border:1px solid var(--line);font-weight:700}
.lvgrid button.w{background:var(--ok);color:#06240f}
.lvgrid button.cur{outline:2px solid var(--acc)}
.peg.tg{border:2px dashed var(--ok)}
/* DESAFIOS DO CINZA */
.czsec{margin-top:46px;padding:22px 16px 18px;border-radius:22px;background:linear-gradient(160deg,rgba(24,24,30,.88),rgba(80,80,92,.4));border:1px solid rgba(255,255,255,.2);box-shadow:0 0 40px rgba(0,0,0,.35)}
.czsec h2{margin:0 0 6px;font-size:clamp(26px,5.5vw,38px);background:linear-gradient(90deg,#f3f4f6,#9ca3af,#e5e7eb);-webkit-background-clip:text;background-clip:text;color:transparent}
.czsec p{color:var(--mut);margin:0 0 4px;line-height:1.45}.czsec small{color:#d1d5db}
.gcard.cz{background:rgba(18,18,24,.7);border-color:rgba(255,255,255,.2);filter:grayscale(.35)}
.gcard.cz::before{background:radial-gradient(circle at 100% 0,#9ca3af,transparent 62%);opacity:.3}
.gcard.cz:hover{border-color:#e5e7eb;filter:none}
.gcard .skull{position:absolute;right:12px;top:8px;font-size:18px}
.lvgrid.cz{grid-template-columns:repeat(5,1fr)}
#game.cinza .top h2{background:linear-gradient(90deg,#f3f4f6,#9ca3af);-webkit-background-clip:text;background-clip:text;color:transparent}
#game.cinza .stat:first-child{border-color:#9ca3af}
/* CRUZADAS */
.cw{display:grid;gap:2px;padding:8px;background:#2b2560;border-radius:12px}
.cw .c{position:relative;width:var(--cs);height:var(--cs);background:#fff8e7;border-radius:3px}
.cw .c.blk{background:transparent}
.cw .c input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:800;font-size:max(16px,calc(var(--cs)*.55));text-transform:uppercase;color:#1a1646;padding:0;outline:0;caret-color:transparent;font-family:inherit}
.cw .c b{position:absolute;top:1px;left:2px;font-size:calc(var(--cs)*.28);color:#6a5acd;pointer-events:none;line-height:1}
.cw .c.hl{background:#ffe9a8}.cw .c.cur{background:#ffd166}.cw .c.bad input{color:var(--bad)}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(94vw,760px)}
.clues h4{margin:0 0 6px;color:var(--acc)}
.clues ol{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.4}
.clues li{padding:5px 8px;border-radius:8px;cursor:pointer}.clues li:hover{background:rgba(255,255,255,.08)}.clues li.on{background:rgba(255,209,102,.25)}
.actclue{min-height:24px;font-weight:700;text-align:center;max-width:94vw}
/* LOGICA */
.lg{width:min(94vw,640px);display:flex;flex-direction:column;gap:12px}
.lgbox{padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.lgbox ol{margin:8px 0 0;padding-left:22px;line-height:1.65}
.lgq{font-size:21px;font-weight:800;text-align:center;margin-bottom:10px}
.tw{overflow-x:auto;margin-top:8px}
.gridt{border-collapse:collapse;margin:6px auto}
.gridt th,.gridt td{border:1px solid var(--line);padding:0;text-align:center;font-size:13px}
.gridt th{padding:6px 8px;font-weight:600;color:var(--mut)}
.gridt td button{width:38px;height:34px;background:none;font-weight:800;font-size:16px}
.gridt td button.x{color:var(--bad)}.gridt td button.y{color:var(--ok)}
.ans{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ans .btn.no{background:var(--bad);opacity:.6}
@media (max-width:520px){.clues{grid-template-columns:1fr}.lvgrid{grid-template-columns:repeat(5,1fr)}.top h2{font-size:20px}.hero{padding-top:30px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="confetti"></canvas>
<div id="app">
  <section id="home">
    <div class="hero">
      <span class="badge">✦ Pegora's Lair ✦</span>
      <h1>Esse jogo é<br>pra você, <span class="nome" id="nome" title="clica aqui 😉"></span></h1>
      <div class="cta">
        <button class="btn main" onclick="document.getElementById('lista').scrollIntoView({behavior:'smooth'})">🎮 Ir pros jogos</button>
        <button class="btn" onclick="document.getElementById('czsec').scrollIntoView({behavior:'smooth'})">💀 Desafios do Cinza</button>
      </div>
      <div class="progress"><div class="bar"><i id="pbar" style="width:0"></i></div><small id="ptxt"></small></div>
    </div>
    <div class="grid" id="lista"></div>
    <div class="czsec" id="czsec">
      <h2>💀 Desafios do Cinza</h2>
      <p>Uma seção só pros corajosos: dificuldade <b>10× acima do Difícil</b>. 20 desafios em cada jogo.</p>
      <small id="czprog"></small>
      <div class="grid" id="listacz"></div>
    </div>
  </section>
  <section id="game" class="hidden">
    <div class="top"><button class="btn sm" id="back">← Menu</button><h2 id="gtitle"></h2></div>
    <div class="rules" id="grules"></div>
    <div class="bar-row lvbar" id="lvbar"></div>
    <div class="stage" id="stage"></div>
  </section>
</div>

<script>
/* ============================================================
   ✏️  PERSONALIZE AQUI  — troque o nome, a frase e a carta
   (também dá pra mandar o link com ?nome=Fulano no final)
   ============================================================ */
const CONFIG = {
  nome: "Pegora"
};
const qNome = new URLSearchParams(location.search).get("nome");
if (qNome) CONFIG.nome = qNome;
document.title = "Pegora's Lair";

/* ---------- utilidades ---------- */
const h=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const k in props){const v=props[k];if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="style")e.style.cssText=v;else e.setAttribute(k,v);}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e;};
let RNG=Math.random;
const rnd=n=>Math.floor(RNG()*n);
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const load=(k,d)=>{try{const v=localStorage.getItem("arcade_"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem("arcade_"+k,JSON.stringify(v));}catch(e){}};
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const stat=(label,val)=>{const s=h("div",{class:"stat"},h("small",{},label));const v=h("span",{},val);s.append(v);s.set=x=>v.textContent=x;return s;};
const levelBtns=(opts,cur,onpick)=>{const wrap=h("div",{class:"bar-row"});const bs=opts.map(([k,l])=>{const b=h("button",{class:"btn sm"+(k===cur?" sel":""),onclick:()=>{bs.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");onpick(k);}},l);return b;});wrap.append(...bs);return wrap;};

/* ---------- fundo de estrelas e confete ---------- */
const sc=document.getElementById("stars"),sx=sc.getContext("2d");let stars=[];
function sizeStars(){sc.width=innerWidth;sc.height=innerHeight;stars=Array.from({length:Math.min(110,innerWidth/8)},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.6+.3,s:Math.random()*.4+.05,p:Math.random()*6}));}
function drawStars(t){sx.clearRect(0,0,sc.width,sc.height);for(const s of stars){s.y-=s.s;if(s.y<-3){s.y=sc.height+3;s.x=Math.random()*sc.width;}sx.globalAlpha=.35+.55*Math.abs(Math.sin(t/900+s.p));sx.fillStyle="#fff";sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill();}requestAnimationFrame(drawStars);}
addEventListener("resize",sizeStars);sizeStars();requestAnimationFrame(drawStars);

const cv=document.getElementById("confetti"),cx=cv.getContext("2d");let parts=[],crun=false;
function confetti(n=170,x=innerWidth/2,y=innerHeight*.35){
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ffd166","#ff6b9d","#8be9fd","#4ade80","#c4b5fd","#fb923c"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*9+3;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,w:Math.random()*8+4,hh:Math.random()*5+3,c:cols[rnd(6)],r:Math.random()*6,vr:(Math.random()-.5)*.3,l:140+rnd(80)});}
  if(!crun){crun=true;requestAnimationFrame(stepC);}
}
function stepC(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l>0);for(const p of parts){p.vy+=.18;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/40);cx.fillRect(-p.w/2,-p.hh/2,p.w,p.hh);cx.restore();}
  if(parts.length)requestAnimationFrame(stepC);else{crun=false;cx.clearRect(0,0,cv.width,cv.height);}}

/* ---- 1. SUDOKU ---- */
function sudoku(root,api){
  const hole=api.tier===3?57+Math.floor((api.level-1)/5):[36,46,54][api.tier];
  let given,sol,vals,sel=-1,done=false;
  const cands=(b,i)=>{const r=Math.floor(i/9),c=i%9,u=new Set();for(let k=0;k<9;k++){u.add(b[r*9+k]);u.add(b[k*9+c]);}const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let d=0;d<3;d++)u.add(b[(br+a)*9+bc+d]);const o=[];for(let v=1;v<=9;v++)if(!u.has(v))o.push(v);return o;};
  const pick=b=>{let best=-1,bc=null,bn=10;for(let i=0;i<81;i++)if(!b[i]){const c=cands(b,i);if(c.length<bn){bn=c.length;best=i;bc=c;if(bn<=1)break;}}return [best,bc];};
  const fill=b=>{const [i,c]=pick(b);if(i<0)return true;for(const v of shuffle(c)){b[i]=v;if(fill(b))return true;}b[i]=0;return false;};
  const count=(b,lim)=>{let n=0;(function rec(){if(n>=lim)return;const [i,c]=pick(b);if(i<0){n++;return;}for(const v of c){b[i]=v;rec();if(n>=lim){b[i]=0;return;}}b[i]=0;})();return n;};
  const grid=h("div",{class:"sdk"});const cells=[];
  for(let i=0;i<81;i++){const r=Math.floor(i/9),c=i%9;const d=h("div",{class:(c%3===2&&c<8?"br ":"")+(r%3===2&&r<8?"bb":""),onclick:()=>{sel=i;paint();}});cells.push(d);grid.append(d);}
  const timer=stat("Tempo","0:00");let secs=0;
  function nova(){
    api.seed();done=false;const b=Array(81).fill(0);fill(b);sol=b.slice();const p=b.slice();let rem=0;
    for(const i of shuffle([...Array(81).keys()])){if(rem>=hole)break;const k=p[i];p[i]=0;if(count(p.slice(),2)!==1)p[i]=k;else rem++;}
    given=p.map(v=>v!==0);vals=p.slice();sel=-1;secs=0;timer.set("0:00");paint();
  }
  const conflict=i=>{const v=vals[i];if(!v)return false;const r=Math.floor(i/9),c=i%9;for(let k=0;k<9;k++){if(k!==c&&vals[r*9+k]===v)return true;if(k!==r&&vals[k*9+c]===v)return true;}const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let d=0;d<3;d++){const j=(br+a)*9+bc+d;if(j!==i&&vals[j]===v)return true;}return false;};
  function paint(){
    const sr=Math.floor(sel/9),sc2=sel%9;
    cells.forEach((d,i)=>{const r=Math.floor(i/9),c=i%9;let cl=(c%3===2&&c<8?"br ":"")+(r%3===2&&r<8?"bb ":"");
      if(given[i])cl+="g ";if(sel>=0){if(i===sel)cl+="se ";else if(vals[sel]&&vals[i]===vals[sel])cl+="sm ";else if(r===sr||c===sc2||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc2/3)))cl+="pe ";}
      if(conflict(i))cl+="bad ";d.className=cl;d.textContent=vals[i]||"";});
  }
  function put(v){if(sel<0||given[sel]||done)return;vals[sel]=v;paint();if(vals.every((x,i)=>x===sol[i])){done=true;api.win("Sudoku resolvido em "+fmt(secs)+"!",nova);}}
  const pad=h("div",{class:"pad"});for(let v=1;v<=9;v++)pad.append(h("button",{onclick:()=>put(v)},v));pad.append(h("button",{onclick:()=>put(0),title:"Apagar"},"⌫"));
  api.on(document,"keydown",e=>{if(/^[1-9]$/.test(e.key))put(+e.key);else if(e.key==="Backspace"||e.key==="Delete"||e.key==="0")put(0);else if(e.key.startsWith("Arrow")&&sel>=0){e.preventDefault();const d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];const n=sel+d;if(n>=0&&n<81&&!(e.key==="ArrowLeft"&&sel%9===0)&&!(e.key==="ArrowRight"&&sel%9===8)){sel=n;paint();}}});
  api.timer(()=>{if(!done){secs++;timer.set(fmt(secs));}},1000);
  root.append(h("div",{class:"bar-row"},timer,h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),grid,pad);
  nova();
}

/* ---- 2. 2048 ---- */
function g2048(root,api){
  const goal=[512,1024,2048,4096][api.tier];
  let g,score=0,best=load("b2048",0),won=false,over=false;
  const board=h("div",{class:"b2048"});const sS=stat("Pontos",0),sB=stat("Recorde",best);let cover=null;
  const empty=()=>g.map((v,i)=>v?-1:i).filter(i=>i>=0);
  let last=-1;
  function add(){const e=empty();if(!e.length)return;last=e[rnd(e.length)];g[last]=Math.random()<.9?2:4;}
  function nova(){api.seed();g=Array(16).fill(0);score=0;won=false;over=false;add();add();render();}
  function render(){
    board.replaceChildren(...g.map((v,i)=>h("div",{class:"t"+(v?" v"+(v>2048?"big":v):"")+(i===last?" n":"")},v||"")));
    sS.set(score);if(score>best){best=score;save("b2048",best);}sB.set(best);
    if(over)board.append(cover=h("div",{class:"cover"},"Sem movimentos 😅",h("button",{class:"btn main",onclick:nova},"Tentar de novo")));
  }
  const line=(row)=>{const a=row.filter(Boolean);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1);}while(a.length<4)a.push(0);return a;};
  const idx=(d,k,j)=>d===0?k*4+j:d===2?k*4+3-j:d===1?j*4+k:(3-j)*4+k;
  function move(d){
    if(over)return;let ch=false;
    for(let k=0;k<4;k++){const row=[0,1,2,3].map(j=>g[idx(d,k,j)]);const nr=line(row);nr.forEach((v,j)=>{if(g[idx(d,k,j)]!==v)ch=true;g[idx(d,k,j)]=v;});}
    if(!ch)return;add();
    const can=()=>empty().length||g.some((v,i)=>(i%4<3&&v===g[i+1])||(i<12&&v===g[i+4]));
    if(!can())over=true;render();
    if(!won&&g.includes(goal)){won=true;api.win("Você chegou no "+goal+"! 🏆");}
  }
  api.on(document,"keydown",e=>{const d={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3}[e.key];if(d!=null){e.preventDefault();move(d);}});
  let t0=null;api.on(board,"touchstart",e=>{t0=[e.touches[0].clientX,e.touches[0].clientY];},{passive:true});
  api.on(board,"touchend",e=>{if(!t0)return;const dx=e.changedTouches[0].clientX-t0[0],dy=e.changedTouches[0].clientY-t0[1];if(Math.max(Math.abs(dx),Math.abs(dy))>24)move(Math.abs(dx)>Math.abs(dy)?(dx>0?2:0):(dy>0?3:1));t0=null;},{passive:true});
  root.append(h("div",{class:"bar-row"},sS,sB,stat("Meta",goal),h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),board);nova();
}

/* ---- 3. MEMÓRIA ---- */
function memoria(root,api){
  const EM=["🦊","🐼","🦁","🐙","🦄","🐸","🍕","🚀","🎸","🌵","🍩","⚽","🎲","🔮","🌈","🍉","🐢","🦋"];
  const level=[12,16,20,36][api.tier];let first=null,lock=false,moves=0,found=0;
  const board=h("div",{class:"mem"});const sM=stat("Jogadas",0);
  function nova(){
    api.seed();const cols=level===36?6:level===20?5:4;board.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    const set=shuffle(EM.slice()).slice(0,level/2);const deck=shuffle([...set,...set]);first=null;lock=false;moves=0;found=0;sM.set(0);
    board.replaceChildren(...deck.map(e=>{const c=h("button",{class:"card"},h("div",{class:"in"},h("div",{class:"bk"},"✦"),h("div",{class:"fr"},e)));c.dataset.e=e;c.onclick=()=>flip(c);return c;}));
  }
  function flip(c){
    if(lock||c.classList.contains("f"))return;c.classList.add("f");
    if(!first){first=c;return;}
    moves++;sM.set(moves);const a=first;first=null;
    if(a.dataset.e===c.dataset.e){a.classList.add("ok");c.classList.add("ok");found++;if(found===level/2)api.later(()=>api.win("Todos os pares em "+moves+" jogadas!",nova),500);}
    else{lock=true;api.later(()=>{a.classList.remove("f");c.classList.remove("f");lock=false;},800);}
  }
  root.append(h("div",{class:"bar-row"},sM,h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),board);nova();
}

/* ---- 4. TORRE DE HANOI ---- */
function hanoi(root,api){
  const n=api.tier===3?8+Math.floor((api.level-1)/10):3+Math.floor((api.level-1)/10);let pegs,sel=-1,moves=0,target=2,min=0;const wrap=h("div",{class:"hanoi"});const sM=stat("Jogadas",0),msg=h("div",{class:"msg"});
  const COL=["#ff6b9d","#ffd166","#4ade80","#8be9fd","#c4b5fd","#fb923c","#f87171","#38bdf8","#a3e635"];
  function bfs(s,tg){const enc=a=>a.reduce((x,p)=>x*3+p,0);const goal=enc(Array(n).fill(tg));const seen=new Set([enc(s)]);let fr=[s],d=0;
    while(fr.length){if(fr.some(a=>enc(a)===goal))return d;const nx=[];
      for(const a of fr){const top=[-1,-1,-1];for(let i=n-1;i>=0;i--)top[a[i]]=i;
        for(let p=0;p<3;p++){const i=top[p];if(i<0)continue;for(let q=0;q<3;q++){if(q===p)continue;if(top[q]>=0&&top[q]<i)continue;const c=a.slice();c[i]=q;const e=enc(c);if(!seen.has(e)){seen.add(e);nx.push(c);}}}}
      fr=nx;d++;}return 0;}
  function nova(){api.seed();let s,tg;do{s=Array.from({length:n},()=>rnd(3));tg=rnd(3);}while(s.every(p=>p===tg));
    target=tg;min=bfs(s,tg);pegs=[[],[],[]];for(let i=n-1;i>=0;i--)pegs[s[i]].push(i+1);sel=-1;moves=0;sM.set(0);msg.textContent="Leve tudo ao pino tracejado. Mínimo possível: "+min+" jogadas";render();}
  function render(){wrap.replaceChildren(...pegs.map((p,pi)=>{const el=h("div",{class:"peg"+(sel===pi?" sel":"")+(pi===target?" tg":""),onclick:()=>click(pi)});
    p.forEach((d,di)=>el.append(h("div",{class:"disc"+(di===p.length-1?" top":""),style:`width:${30+d*(62/n)}%;height:${n>7?19:26}px;background:${COL[d-1]}`})));return el;}));}
  function click(i){
    if(sel<0){if(pegs[i].length){sel=i;render();}return;}
    if(sel===i){sel=-1;render();return;}
    const d=pegs[sel][pegs[sel].length-1],t=pegs[i][pegs[i].length-1];
    if(t&&t<d){msg.textContent="Disco grande não pode ficar em cima de um menor 🙅";sel=-1;render();return;}
    pegs[sel].pop();pegs[i].push(d);sel=-1;moves++;sM.set(moves);render();
    if(pegs[target].length===n)api.win(moves===min?"PERFEITO! Jogadas mínimas ("+min+")!":"Resolvido em "+moves+" jogadas (mínimo: "+min+")");
  }
  root.append(h("div",{class:"bar-row"},stat("Discos",n),sM,h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),wrap,msg);nova();
}

/* ---- 5. QUEBRA-CABEÇA DESLIZANTE ---- */
function deslizante(root,api){
  const N=api.tier===3?(api.level<=10?6:7):[3,4,5][api.tier];let t,moves=0;const board=h("div",{class:"slide"});const sM=stat("Jogadas",0);
  const solved=()=>t.every((v,i)=>v===(i+1)%(N*N));
  function nova(){
    api.seed();t=[...Array(N*N).keys()].map(i=>(i+1)%(N*N));let b=N*N-1,prev=-1;
    for(let k=0;k<N*N*30;k++){const nb=neighbors(b).filter(x=>x!==prev);const m=nb[rnd(nb.length)];[t[b],t[m]]=[t[m],t[b]];prev=b;b=m;}
    if(solved())return nova();moves=0;sM.set(0);render();
  }
  function neighbors(b){const r=Math.floor(b/N),c=b%N,o=[];if(r>0)o.push(b-N);if(r<N-1)o.push(b+N);if(c>0)o.push(b-1);if(c<N-1)o.push(b+1);return o;}
  function render(){board.style.gridTemplateColumns=`repeat(${N},1fr)`;board.replaceChildren(...t.map((v,i)=>h("button",{class:(v?"":"e ")+(v&&v===i+1?"right":""),onclick:()=>tap(i)},v||"")));}
  function tap(i){const b=t.indexOf(0);if(!neighbors(b).includes(i))return;[t[b],t[i]]=[t[i],t[b]];moves++;sM.set(moves);render();if(solved())api.later(()=>api.win("Resolvido em "+moves+" movimentos!",nova),250);}
  api.on(document,"keydown",e=>{const b=t.indexOf(0);const d={ArrowUp:N,ArrowDown:-N,ArrowLeft:1,ArrowRight:-1}[e.key];if(!d)return;e.preventDefault();const i=b+d;if(i<0||i>=N*N)return;if(Math.abs(d)===1&&Math.floor(i/N)!==Math.floor(b/N))return;tap(i);});
  root.append(h("div",{class:"bar-row"},sM,h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),board);nova();
}

/* ---- 6. CAMPO MINADO ---- */
function minas(root,api){
  const LV={facil:[9,9,10],medio:[12,12,24],dificil:[14,16,40],cinza:[20,16,58+api.level]};const lv=["facil","medio","dificil","cinza"][api.tier];
  let R,C,M,mine,rev,flag,adj,btns,started,over,flagMode=false,secs,left;
  const board=h("div",{class:"ms"});const sT=stat("Tempo","0:00"),sF=stat("Minas","0");
  const nb=i=>{const r=Math.floor(i/C),c=i%C,o=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const rr=r+a,cc=c+b;if(rr>=0&&rr<R&&cc>=0&&cc<C)o.push(rr*C+cc);}return o;};
  function nova(){api.seed();[R,C,M]=LV[lv];mine=Array(R*C).fill(false);rev=Array(R*C).fill(false);flag=Array(R*C).fill(false);adj=Array(R*C).fill(0);started=false;over=false;secs=0;left=M;sT.set("0:00");sF.set(M);
    const cs=Math.max(16,Math.min(38,Math.floor((Math.min(innerWidth,760)-32-12-2*(C-1))/C)));board.style.cssText=`--cs:${cs}px;grid-template-columns:repeat(${C},${cs}px)`;
    btns=Array.from({length:R*C},(_,i)=>{const b=h("button",{onclick:()=>open(i),oncontextmenu:e=>{e.preventDefault();toggle(i);}});return b;});board.replaceChildren(...btns);}
  function place(safe){const ban=new Set([safe,...nb(safe)]);const pool=shuffle([...Array(R*C).keys()].filter(i=>!ban.has(i)));pool.slice(0,M).forEach(i=>mine[i]=true);for(let i=0;i<R*C;i++)adj[i]=nb(i).filter(j=>mine[j]).length;started=true;}
  function toggle(i){if(over||rev[i])return;flag[i]=!flag[i];left+=flag[i]?-1:1;sF.set(left);draw(i);}
  function draw(i){const b=btns[i];b.className="";b.textContent="";if(rev[i]){b.classList.add("r");if(mine[i]){b.classList.add("m");b.textContent="💣";}else if(adj[i]){b.textContent=adj[i];b.classList.add("n"+adj[i]);}}else if(flag[i])b.textContent="🚩";}
  function open(i){
    if(over)return;if(flagMode){toggle(i);return;}
    if(flag[i])return;if(!started)place(i);
    if(rev[i]){const f=nb(i).filter(j=>flag[j]).length;if(adj[i]&&f===adj[i])nb(i).forEach(j=>{if(!flag[j]&&!rev[j])reveal(j);});check();return;}
    reveal(i);check();
  }
  function reveal(i){const st=[i];while(st.length){const k=st.pop();if(rev[k]||flag[k])continue;rev[k]=true;draw(k);if(mine[k]){lose();return;}if(adj[k]===0)nb(k).forEach(j=>{if(!rev[j])st.push(j);});}}
  function lose(){over=true;mine.forEach((m,i)=>{if(m){rev[i]=true;draw(i);}});api.later(()=>modal([h("div",{class:"big"},"💥"),h("h3",{},"Ops, uma mina!"),h("p",{},"Acontece com os melhores. Bora tentar de novo?"),h("button",{class:"btn main",onclick:e=>{e.target.closest(".ov").remove();nova();}},"Jogar de novo")]),500);}
  function check(){if(over)return;if(rev.filter(Boolean).length===R*C-M){over=true;api.win("Campo limpo em "+fmt(secs)+"!",nova);}}
  api.timer(()=>{if(started&&!over){secs++;sT.set(fmt(secs));}},1000);
  const fm=h("button",{class:"btn sm",onclick:()=>{flagMode=!flagMode;fm.classList.toggle("sel",flagMode);}},"🚩 Modo bandeira");
  root.append(h("div",{class:"bar-row"},sT,sF),h("div",{class:"bar-row"},fm,h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),board);nova();
}

/* ---- 7. APAGUE AS LUZES ---- */
function luzes(root,api){
  const S=api.tier===3?7:5;const hard=api.tier===3?14+api.level:4+Math.floor((api.level-1)/5);let g,moves=0;const board=h("div",{class:"lo"});const sM=stat("Jogadas",0);
  const press=i=>{const r=Math.floor(i/S),c=i%S;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const rr=r+a,cc=c+b;if(rr>=0&&rr<S&&cc>=0&&cc<S)g[rr*S+cc]=!g[rr*S+cc];});};
  function nova(){api.seed();board.style.gridTemplateColumns="repeat("+S+",1fr)";g=Array(S*S).fill(false);const ps=shuffle([...Array(S*S).keys()]).slice(0,hard);ps.forEach(press);if(!g.some(Boolean))return nova();moves=0;sM.set(0);render();}
  function render(){board.replaceChildren(...g.map((on,i)=>h("button",{class:on?"on":"",onclick:()=>{press(i);moves++;sM.set(moves);render();if(!g.some(Boolean))api.later(()=>api.win("Tudo apagado em "+moves+" jogadas!",nova),300);}})));}
  root.append(h("div",{class:"bar-row"},sM,h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),board);nova();

/* ---- 8. JOGO DA VELHA ---- */
function velha(root,api){
  const CZ=api.tier===3,lv=["facil","medio","dificil","dificil"][api.tier];
  const ME=CZ?"O":"X",AI=CZ?"X":"O";
  let b,over,tally=load("tttTally",{v:0,e:0,d:0});
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=bd=>{for(const l of L)if(bd[l[0]]&&bd[l[0]]===bd[l[1]]&&bd[l[0]]===bd[l[2]])return l;return null;};

/* ---- 9. QUATRO EM LINHA ---- */
function quatro(root,api){
  const W=[];for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const rr=r+dr*3,cc=c+dc*3;if(rr<6&&cc>=0&&cc<7)W.push([0,1,2,3].map(k=>(r+dr*k)*7+c+dc*k));}

  const winner=bd=>{for(const w of W){const v=bd[w[0]];if(v&&v===bd[w[1]]&&v===bd[w[2]]&&v===bd[w[3]])return w;}return null;};
  const dropRow=(bd,c)=>{for(let r=5;r>=0;r--)if(!bd[r*7+c])return r;return -1;};
  const ORDER=[3,2,4,1,5,0,6];
  const evalb=(bd,p)=>{let s=0;for(let r=0;r<6;r++){if(bd[r*7+3]===p)s+=3;else if(bd[r*7+3]===3-p)s-=3;}for(const w of W){let m=0,t=0;for(const i of w){if(bd[i]===p)m++;else if(bd[i])t++;}if(!t){if(m===3)s+=6;else if(m===2)s+=2;}else if(!m){if(t===3)s-=7;else if(t===2)s-=2;}}return s;};
  const nega=(bd,d,a,be,p)=>{if(winner(bd))return -(1000+d);if(bd.every(Boolean))return 0;if(!d)return evalb(bd,p);let best=-1e9;for(const c of ORDER){const r=dropRow(bd,c);if(r<0)continue;bd[r*7+c]=p;const v=-nega(bd,d-1,-be,-a,3-p);bd[r*7+c]=0;if(v>best)best=v;if(best>a)a=best;if(a>=be)break;}return best;};
  function aiMove(){let bc=-1,bv=-1e9;for(const c of shuffle(ORDER.slice())){const r=dropRow(b,c);if(r<0)continue;b[r*7+c]=2;let v=winner(b)?5000:-nega(b,lv-1,-1e9,1e9,1);b[r*7+c]=0;if(v>bv){bv=v;bc=c;}}return bc;}
  function nova(){api.seed();over=false;busy=false;const pairs=(api.level-1)%4;let tries=0;do{b=Array(42).fill(0);for(let k=0;k<pairs*2;k++){const cs=[];for(let c=0;c<7;c++)if(dropRow(b,c)>=0)cs.push(c);const c=cs[rnd(cs.length)];b[dropRow(b,c)*7+c]=k%2?2:1;}}while(winner(b)&&++tries<50);if(winner(b))b=Array(42).fill(0);msg.textContent="Sua vez (vermelho)";render();if(api.tier===3){busy=true;msg.textContent="A IA começa…";api.later(()=>{const m=aiMove();b[dropRow(b,m)*7+m]=2;busy=false;render();msg.textContent="Sua vez (vermelho)";},500);}}
  function render(w){board.replaceChildren(...b.map((v,i)=>h("button",{class:(v?"p"+v:"")+(w&&w.includes(i)?" w":""),onclick:()=>drop(i%7)})));}
  function finish(){const w=winner(b);if(w){over=true;render(w);if(b[w[0]]===1)api.win("Você ligou 4! Vitória!",nova);else{msg.textContent="A IA ligou 4. Revanche?";}return true;}if(b.every(Boolean)){over=true;msg.textContent="Empate!";return true;}return false;}
  function drop(c){if(over||busy)return;const r=dropRow(b,c);if(r<0)return;b[r*7+c]=1;render();if(finish())return;busy=true;msg.textContent="IA pensando…";api.later(()=>{const m=aiMove();const rr=dropRow(b,m);b[rr*7+m]=2;busy=false;render();if(!finish())msg.textContent="Sua vez (vermelho)";},350);}
  root.append(h("div",{class:"bar-row"},h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),board,msg);nova();

  const CZ=api.tier===3;const SZ=CZ?17:15,target=CZ?14+Math.floor((api.level-1)/3):6+Math.floor((api.level-1)/7),maxLen=[7,9,12,12][api.tier];
  let W,H,cells,words,sel=null,dir=0,done=false;

  function can(g,m,w,r,c,d){const dr=d?1:0,dc=d?0:1,L=w.length;
    if(r+dr*(L-1)>=SZ||c+dc*(L-1)>=SZ)return -1;
    const pr=r-dr,pc=c-dc,nr=r+dr*L,nc=c+dc*L;
    if(pr>=0&&pc>=0&&g[pr][pc])return -1;if(nr<SZ&&nc<SZ&&g[nr][nc])return -1;
    let x=0;
    for(let i=0;i<L;i++){const rr=r+dr*i,cc=c+dc*i,ch=g[rr][cc];
      if(ch){if(ch!==w[i]||(m[rr][cc]&(d?2:1)))return -1;x++;}
      else{const a1=rr+dc,a2=cc+dr,b1=rr-dc,b2=cc-dr;if(a1<SZ&&a2<SZ&&g[a1][a2])return -1;if(b1>=0&&b2>=0&&g[b1][b2])return -1;}}
    return x;}
  function build(){
    const pool=BANK.filter(([w])=>w.length<=maxLen);let best=null;
    for(let att=0;att<25;att++){
      const g=Array.from({length:SZ},()=>Array(SZ).fill("")),m=Array.from({length:SZ},()=>Array(SZ).fill(0)),placed=[];
      const put=(e,r,c,d)=>{for(let i=0;i<e[0].length;i++){const rr=r+(d?i:0),cc=c+(d?0:i);g[rr][cc]=e[0][i];m[rr][cc]|=d?2:1;}placed.push({w:e[0],clue:e[1],r,c,d});};
      const order=shuffle(pool.slice());const f=order.shift();put(f,Math.floor(SZ/2),Math.floor((SZ-f[0].length)/2),0);
      for(const e of order){if(placed.length>=target)break;let bs=0,cand=[];
        for(let d=0;d<2;d++)for(let r=0;r<SZ;r++)for(let c=0;c<SZ;c++){const x=can(g,m,e[0],r,c,d);if(x>bs){bs=x;cand=[[r,c,d]];}else if(x===bs&&x>0)cand.push([r,c,d]);}

    const mk=(d,title)=>{const ol=h("ol");words.filter(w=>w.d===d).sort((a,b)=>a.n-b.n).forEach(w=>{w.li=h("li",{onclick:()=>{const t=w.cells.find(c=>!c.val)||w.cells[0];dir=w.d;pick(t,false);}},w.n+". "+w.clue+(CZ?"":" ("+w.w.length+")"));ol.append(w.li);});return h("div",{},h("h4",{},title),ol);};

  function pick(cell,toggle){
    const has=[cell.wd[0]>=0,cell.wd[1]>=0];

  function nova(){api.seed();msg.textContent="";setup();draw();pick(words[0].cells[0],false);}
  root.append(h("div",{class:"bar-row"},h("button",{class:"btn sm main",onclick:check},"✔ Conferir"),h("button",{class:"btn sm",onclick:reveal},"💡 Revelar letra"),h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),act,grid,msg,clueBox);

/* ---- 14. QUEM É QUEM? (lógica de dedução) ---- */
function logica(root,api){
  const lv=api.level;let N,K;
  if(api.tier===3){N=5;K=4;}else if(lv<=8){N=3;K=2;}else if(lv<=17){N=4;K=2;}else if(lv<=26){N=3;K=3;}else if(lv<=34){N=4;K=3;}else if(lv<=42){N=5;K=3;}else{N=4;K=4;}
  const POS=[70,45,30,12][api.tier],NEG=[20,30,35,38][api.tier];
  const NAMES=["Ana","Bruno","Carla","Diego","Elisa","Fábio"];
  const CATS=[
    {pre:"está de camisa",items:["verde","amarela","vermelha","azul","preta","roxa"]},
    {pre:"tem",items:["um cachorro","um gato","um papagaio","um coelho","um peixe","um hamster"]},
    {pre:"gosta de",items:["banana","uva","manga","morango","laranja","maçã"]},
    {pre:"joga",items:["futebol","vôlei","tênis","basquete","natação","xadrez"]}];
  const PERMS=[];(function pm(a,rest){if(!rest.length){PERMS.push(a);return;}for(let i=0;i<rest.length;i++)pm([...a,rest[i]],rest.filter((_,j)=>j!==i));})([],[...Array(N).keys()]);
  let names,cats,clues,qc,qv,ans,st,val,who;
  const ph=(c,v)=>cats[c].pre+" "+cats[c].items[v];
  const text=c=>{
    const S=c.cs===0?names[c.vs]:"Quem "+ph(c.cs,c.vs);let O;
    if(c.co===0)O=c.t==="p"?"é "+names[c.vo]:c.t==="n"?"não é "+names[c.vo]:"é "+names[c.o[0]]+" ou "+names[c.o[1]];
    else O=c.t==="p"?ph(c.co,c.vo):c.t==="n"?"não "+ph(c.co,c.vo):cats[c.co].pre+" "+cats[c.co].items[c.o[0]]+" ou "+cats[c.co].items[c.o[1]];
    return S+" "+O+".";
  };
  function rc(){
    const cs=rnd(K);let co=rnd(K-1);if(co>=cs)co++;const vs=rnd(N),p=who[cs][vs],vt=val[co][p],r=rnd(100);
    if(r<POS)return {t:"p",cs,vs,co,vo:vt};
    let other=rnd(N-1);if(other>=vt)other++;
    if(r<POS+NEG)return {t:"n",cs,vs,co,vo:other};
    return {t:"o",cs,vs,co,o:rnd(2)?[vt,other]:[other,vt]};
  }
  function count(cl){
    let n=0;const wh=Array.from({length:K},()=>Array(N).fill(-1));wh[0]=[...Array(N).keys()];
    const by=Array.from({length:K},()=>[]);for(const c of cl)by[Math.max(c.cs,c.co)].push(c);
    const ok=cat=>by[cat].every(c=>{const p=wh[c.cs][c.vs];if(c.t==="p")return p===wh[c.co][c.vo];if(c.t==="n")return p!==wh[c.co][c.vo];return p===wh[c.co][c.o[0]]||p===wh[c.co][c.o[1]];});
    (function rec(cat){if(n>1)return;if(cat===K){n++;return;}for(const pm of PERMS){if(n>1)return;pm.forEach((v,p)=>wh[cat][v]=p);if(ok(cat))rec(cat+1);}})(1);
    return n;
  }
  function gen(){
    names=shuffle(NAMES.slice()).slice(0,N);
    cats=[{items:names},...shuffle(CATS.slice()).slice(0,K-1).map(c=>({pre:c.pre,items:shuffle(c.items.slice()).slice(0,N)}))];
    val=[[...Array(N).keys()],...cats.slice(1).map(()=>shuffle([...Array(N).keys()]))];
    who=val.map(v=>{const w=[];v.forEach((x,p)=>w[x]=p);return w;});
    let chosen=[];
    for(let i=0;i<400;i++){chosen.push(rc());if(count(chosen)===1)break;}
    for(let i=chosen.length-1;i>=0;i--){const t=chosen.slice();t.splice(i,1);if(count(t)===1)chosen=t;}
    clues=chosen;
    const direct=(cc,v)=>clues.some(c=>c.t==="p"&&((c.cs===0&&c.co===cc&&c.vo===v)||(c.co===0&&c.cs===cc&&c.vs===v)));
    const opts=[];for(let cc=1;cc<K;cc++)for(let v=0;v<N;v++)opts.push([cc,v]);
    const fresh=opts.filter(([cc,v])=>!direct(cc,v));const pickq=(fresh.length?fresh:opts)[rnd((fresh.length?fresh:opts).length)];
    [qc,qv]=pickq;ans=who[qc][qv];
    st=Array.from({length:K},()=>Array.from({length:N},()=>Array(N).fill(0)));
  }
  const holder=h("div");
  function render(){
    const box=h("div",{class:"lg"});
    box.append(h("div",{class:"lgbox"},h("b",{},"🔎 Pistas"),h("ol",{},clues.map(c=>h("li",{},text(c))))));
    const nb=h("div",{class:"lgbox"},h("b",{},"📒 Caderno de anotações"),h("div",{style:"font-size:13px;color:var(--mut)"},"Toque nas células: ✗ = não, ✓ = sim. Só pra te ajudar a pensar."));
    for(let c=1;c<K;c++){
      const tb=h("table",{class:"gridt"},h("tr",{},h("th",{}),cats[c].items.map(i=>h("th",{},i.replace(/^um /,"")))));
      names.forEach((n,p)=>{const tr=h("tr",{},h("th",{},n));cats[c].items.forEach((_,v)=>{
        const b=h("button",{});const upd=()=>{b.textContent=["","✗","✓"][st[c][p][v]];b.className=["","x","y"][st[c][p][v]];};
        b.onclick=()=>{st[c][p][v]=(st[c][p][v]+1)%3;upd();};upd();tr.append(h("td",{},b));});tb.append(tr);});
      nb.append(h("div",{class:"tw"},tb));
    }
    box.append(nb);
    const q=h("div",{class:"lgbox"},h("div",{class:"lgq"},"❓ Quem "+ph(qc,qv)+"?"));
    const row=h("div",{class:"ans"});
    names.forEach((n,i)=>{const b=h("button",{class:"btn",onclick:()=>{
      if(i===ans)api.win(n+" "+ph(qc,qv)+". Dedução perfeita!");
      else{b.classList.add("no");b.disabled=true;msg.textContent="Hmm, não é "+n+". Releia as pistas com calma 🕵️";}}},n);row.append(b);});
    q.append(row,msg);box.append(q);holder.replaceChildren(box);
  }
  const msg=h("div",{class:"msg",style:"margin-top:10px"});
  function nova(){api.seed();msg.textContent="";gen();render();}
  root.append(h("div",{class:"bar-row"},h("button",{class:"btn sm",onclick:nova},"↻ Reiniciar")),holder);
  nova();
}

  const ct=GAMES.reduce((s,g)=>s+wonLv(g.id,true).length,0),call=GAMES.length*CLEVELS;
  document.getElementById("czprog").textContent=ct?`Desafios vencidos: ${ct} de ${call}`:`${call} desafios. Boa sorte.`;
  document.getElementById("listacz").replaceChildren(...GAMES.map(g=>{const n=wonLv(g.id,true).length;return h("button",{class:"gcard cz",onclick:()=>{location.hash="cinza-"+g.id;}},
    n?h("span",{class:"done"},n+"/"+CLEVELS):h("span",{class:"skull"},"💀"),h("div",{class:"em"},g.emoji),h("b",{},g.nome),h("span",{},CZINFO[g.id].charAt(0).toUpperCase()+CZINFO[g.id].slice(1)));}));
}
function route(id=location.hash.slice(1)){
  cleanup();document.querySelectorAll(".ov").forEach(o=>o.remove());
  const cz=id.startsWith("cinza-"),g=GAMES.find(x=>x.id===(cz?id.slice(6):id));
  if(!g){gameSec.classList.add("hidden");home.classList.remove("hidden");renderHome();return;}
  home.classList.add("hidden");gameSec.classList.remove("hidden");window.scrollTo(0,0);
  startLevel(g,pickLevel(g,cz),cz);
}
function picker(g,level,cz){
  const N=cz?CLEVELS:LEVELS,won=new Set(wonLv(g.id,cz));
  const ov=modal([h("h3",{},cz?"Escolha o desafio":"Escolha a fase"),h("p",{},"Verde = já vencida"),h("div",{class:"lvgrid"+(cz?" cz":"")},Array.from({length:N},(_,i)=>i+1).map(l=>h("button",{class:(won.has(l)?"w ":"")+(l===level?"cur":""),onclick:()=>{ov.remove();startLevel(g,l,cz);}},l)))]);
}
function startLevel(g,level,cz=false){
  cleanup();document.querySelectorAll(".ov").forEach(o=>o.remove());stage.replaceChildren();
  const N=cz?CLEVELS:LEVELS,tier=cz?3:tierOf(level),won=new Set(wonLv(g.id,cz));
  document.getElementById("gtitle").textContent=(cz?"💀 ":"")+g.emoji+" "+g.nome;
  document.getElementById("grules").textContent=g.regras+(cz?" 💀 Desafios do Cinza: "+CZINFO[g.id]:"");
  gameSec.classList.toggle("cinza",cz);
  document.getElementById("lvbar").replaceChildren(
    h("button",{class:"btn sm",onclick:()=>startLevel(g,(level+N-2)%N+1,cz)},"◀"),
    h("span",{class:"stat"},`${cz?"Desafio":"Fase"} ${level}/${N} · ${cz?"💀 Cinza":TIERS[tier]}`+(won.has(level)?" ✓":"")),
    h("button",{class:"btn sm",onclick:()=>startLevel(g,level%N+1,cz)},"▶"),
    h("button",{class:"btn sm",onclick:()=>startLevel(g,pickLevel(g,cz,level),cz)},"🎲 Aleatória"),
    h("button",{class:"btn sm",onclick:()=>picker(g,level,cz)},"📋 "+(cz?"Desafios":"Fases")),
    cz?h("button",{class:"btn sm",onclick:()=>startLevel(g,pickLevel(g,false),false)},"↩ Fases normais"):h("button",{class:"btn sm",onclick:()=>startLevel(g,pickLevel(g,true),true)},"💀 Desafios do Cinza"));
  const hs=[...g.id].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7);
  const api={level,tier,
    seed(){RNG=mulberry(level*7919+hs+(cz?1000003:0));},
    on(t,ev,fn,o){t.addEventListener(ev,fn,o);undo.push(()=>t.removeEventListener(ev,fn,o));},
    timer(fn,ms){const i=setInterval(fn,ms);undo.push(()=>clearInterval(i));},
    later(fn,ms){const i=setTimeout(fn,ms);undo.push(()=>clearTimeout(i));},
    win(msg){const w=new Set(wonLv(g.id,cz));w.add(level);save(wonKey(g.id,cz),[...w]);
      confetti(cz?240:170);api.later(()=>confetti(110,innerWidth*.2,innerHeight*.5),250);api.later(()=>confetti(110,innerWidth*.8,innerHeight*.5),450);
      const ov=modal([h("div",{class:"big"},cz?"💀":"🏆"),h("h3",{},cz?"Digno de um Cinza, "+CONFIG.nome+"!":"Parabéns, "+CONFIG.nome+"!"),h("p",{},msg+(cz?" (desafio ":" (fase ")+level+")"),
        h("div",{class:"cta"},h("button",{class:"btn main",onclick:()=>startLevel(g,pickLevel(g,cz,level),cz)},cz?"Próximo desafio 💀":"Próxima fase 🎲"),h("button",{class:"btn",onclick:()=>{ov.remove();location.hash="";}},"Menu"))]);}
  };
  g.fn(stage,api);
}
document.getElementById("nome").onclick=e=>confetti(120,e.clientX,e.clientY);
document.getElementById("back").onclick=()=>{location.hash="";};
addEventListener("hashchange",()=>route());
route();
</script>
